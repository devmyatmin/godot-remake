name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: Prepare archive argument chunker
      if: runner.os == 'Linux'
      shell: sh
      run: |
        mkdir -p "$RUNNER_TEMP/amgnyalabs-ar"
        cp "${{ github.action_path }}/ar_chunker.py" "$RUNNER_TEMP/amgnyalabs-ar/ar"
        chmod +x "$RUNNER_TEMP/amgnyalabs-ar/ar"
        echo "$RUNNER_TEMP/amgnyalabs-ar" >> "$GITHUB_PATH"

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./godot-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
