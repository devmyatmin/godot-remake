name: AmgNya Operator Gateway Tests

on:
  push:
    branches:
      - "amgnyalabs/**"
    paths:
      - "amgnyalabs/operator_gateway/**"
      - ".github/workflows/amgnyalabs-operator-tests.yml"
  pull_request:
    paths:
      - "amgnyalabs/operator_gateway/**"
      - ".github/workflows/amgnyalabs-operator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: \${{ matrix.python-version }}
      - name: Run gateway security tests
        working-directory: amgnyalabs/operator_gateway
        run: python -m unittest discover -s tests -v
