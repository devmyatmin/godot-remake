name: AmgNya Operator Tests

on:
  push:
    branches:
      - "amgnyalabs/**"
    paths:
      - "amgnyalabs/operator_gateway/**"
      - "amgnyalabs/qwen_operator/**"
      - "amgnyalabs/unity_compat/**"
      - ".github/workflows/amgnyalabs-operator-tests.yml"
  pull_request:
    paths:
      - "amgnyalabs/operator_gateway/**"
      - "amgnyalabs/qwen_operator/**"
      - "amgnyalabs/unity_compat/**"
      - ".github/workflows/amgnyalabs-operator-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install Unity compatibility parser
        run: python -m pip install -r amgnyalabs/unity_compat/requirements.txt
      - name: Run Unity binary importer tests
        run: python -m unittest discover -s amgnyalabs/unity_compat/tests -v
      - name: Run gateway security tests
        working-directory: amgnyalabs/operator_gateway
        run: python -m unittest discover -s tests -v
      - name: Run Qwen adapter validation tests
        run: python -m unittest discover -s amgnyalabs/qwen_operator/tests -v
